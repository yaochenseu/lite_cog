# Map-frame rolling waypoint manager. No per-velocity service checks.
lookahead: 0.9
corner_cut: 0.12
target_step: 0.18
correction_step: 0.08
target_period: 0.3
# Single-update discontinuities, measured near the robot/active target.
jump_distance: 0.8
jump_yaw: 0.5
stall_timeout: 15.0
max_replans: 2
xy_tolerance: 0.15
yaw_tolerance: 0.12
